<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const stored = localStorage.getItem('color-scheme');
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) {
          meta.content = stored ?? 'light dark';
        }
        const isDark = stored === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
      } catch (_) {}
    </script>
    <title>Sparklegrid — Digital Products, AI & Brand Experiences</title>
    <meta
      name="description"
      content="Sparklegrid designs and builds modern web & mobile apps, smart AI workflows, and standout digital brands."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-zinc-50 text-zinc-950 dark:bg-[#050507] dark:text-zinc-100 antialiased selection:bg-spark-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
